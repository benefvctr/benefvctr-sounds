# Render Blueprint for NIGHT SHIFT.
# Render → New → Blueprint → pick this repo. Render reads this file, creates the
# service, and prompts you for any value marked `sync: false`.
#
# NOTE: this repo is PUBLIC, so nothing secret lives in this file. Every secret
# (and the Supabase URL) is `sync: false` — you type those into Render's
# dashboard once and they're stored encrypted, never committed.

services:
  - type: web
    name: night-shift
    runtime: node
    plan: free                 # always-on? switch to "starter" (~$7/mo) to kill cold starts
    # The app lives on this branch until you merge it to main. Point the
    # blueprint at whichever branch holds the code.
    branch: claude/fable-5-0-model-5e2h88
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true           # redeploy on every push to the branch above
    envVars:
      - key: TWITCH_CHANNEL
        sync: false            # your channel login (read-only, no token needed)
      - key: SUPABASE_URL
        sync: false            # https://qqbgwrkyqvdfkhqpmvan.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false            # service_role key — Settings → API Keys in Supabase
      - key: DIRECTOR_KEY
        sync: false            # any string; locks /director so only you can use it
