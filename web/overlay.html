<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>NIGHT SHIFT — overlay</title>
<style>
  /* Designed as a 1920x1080 OBS browser source. Background is transparent;
     only the HUD elements render. */
  :root {
    --amber: #ffb454;
    --red: #ff4f4f;
    --green: #6dffa6;
    --blue: #5fb7ff;
    --ink: rgba(8, 9, 12, 0.88);
    --line: rgba(255, 180, 84, 0.35);
    /* Layout knobs — tweak these to fit your scene:
       --cam-clear : empty space kept on the bottom-RIGHT for your facecam.
                     Increase if the squad panel still touches your camera.
       --vote-width: width of the vote/decision box (now anchored bottom-left). */
    --cam-clear: 540px;
    --vote-width: 520px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body {
    font-family: 'Courier New', ui-monospace, monospace;
    color: var(--amber);
    text-transform: uppercase;
    position: relative;
  }

  /* full-screen pulse vignette */
  #pulse {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    transition: opacity 1.2s ease-out;
  }
  #pulse.death   { box-shadow: inset 0 0 240px 80px rgba(255, 40, 40, 0.55); }
  #pulse.extract { box-shadow: inset 0 0 240px 80px rgba(80, 255, 150, 0.45); }
  #pulse.curse   { box-shadow: inset 0 0 280px 120px rgba(60, 0, 80, 0.6); }
  #pulse.bless   { box-shadow: inset 0 0 240px 80px rgba(255, 220, 120, 0.45); }
  #pulse.on { opacity: 1; transition: opacity 0.05s; }

  .panel {
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .panel::after { /* scanlines */
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px);
  }

  /* ---------- idle badge ---------- */
  #idle {
    position: absolute; left: 36px; bottom: 36px;
    padding: 14px 22px; font-size: 20px; letter-spacing: 2px;
    display: none;
  }
  #idle b { color: #fff; }
  #idle .blink { animation: blink 1.6s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* ---------- lower third (active shift) ---------- */
  #hud {
    /* Stops short of the right edge so it never covers the facecam. */
    position: absolute; left: 36px; right: var(--cam-clear); bottom: 36px;
    display: none; gap: 16px;
  }
  #hud.show, #idle.show { display: flex; }

  #status { width: 320px; padding: 18px 20px; flex-shrink: 0; }
  #status .shift { font-size: 26px; letter-spacing: 3px; color: #fff; }
  #status .room { font-size: 15px; margin-top: 8px; letter-spacing: 1px; min-height: 38px; }
  #status .timer { font-size: 44px; margin-top: 6px; font-weight: bold; }
  #status .timer.low { color: var(--red); animation: blink 0.8s steps(2) infinite; }
  #status .bar { height: 4px; background: rgba(255,180,84,0.15); margin-top: 10px; }
  #status .bar i { display: block; height: 100%; background: var(--amber); transition: width 1s linear; }

  #feed {
    flex: 1; padding: 12px 20px; font-size: 16px; letter-spacing: 0.5px;
    display: flex; flex-direction: column; justify-content: flex-end;
    overflow: hidden; max-height: 190px;
    /* old lines fade out at the top instead of being chopped mid-letter */
    mask-image: linear-gradient(to bottom, transparent 4px, black 36px);
    -webkit-mask-image: linear-gradient(to bottom, transparent 4px, black 36px);
  }
  #feed .line { padding: 2px 0; opacity: 0.55; white-space: normal; line-height: 1.3; }
  #feed .line:last-child { opacity: 1; color: #fff; }
  #feed .line.death { color: var(--red); opacity: 1; }
  #feed .line.loot { color: var(--green); }
  #feed .line.extract { color: var(--green); opacity: 1; }
  #feed .line.vote { color: var(--blue); }
  #feed .line.danger { color: var(--red); }

  #squad { width: 360px; padding: 14px 18px; flex-shrink: 0; }
  #squad h3 { font-size: 13px; letter-spacing: 2px; opacity: 0.7; margin-bottom: 8px; }
  #squad .chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 130px; overflow: hidden; }
  .chip {
    font-size: 13px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 3px;
    color: #fff; background: rgba(255,180,84,0.08); letter-spacing: 1px;
  }
  .chip.dead { color: rgba(255,79,79,0.8); border-color: rgba(255,79,79,0.4); text-decoration: line-through; background: transparent; }
  .chip.wounded { color: var(--red); border-color: var(--red); }
  .chip.shield { box-shadow: 0 0 8px rgba(95,183,255,0.8); border-color: var(--blue); }
  .chip .haul { color: var(--green); margin-left: 6px; }

  /* ---------- room mini-map (status panel) ---------- */
  #minimap { display: flex; align-items: center; gap: 0; margin-top: 12px; }
  #minimap.hidden { display: none; }
  .mnode {
    flex: 1; height: 24px; display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,180,84,0.25); border-radius: 3px; font-size: 11px; color: rgba(216,211,200,0.4);
    position: relative; background: rgba(0,0,0,0.3);
  }
  .mlink { width: 10px; height: 2px; background: rgba(255,180,84,0.2); flex-shrink: 0; }
  .mnode.done { color: var(--amber); border-color: var(--line); }
  .mnode.done.dead { color: var(--red); border-color: rgba(255,79,79,0.4); }
  .mnode.now { color: #fff; border-color: var(--amber); box-shadow: 0 0 10px rgba(255,180,84,0.6); animation: blink 1.2s steps(2) infinite; }
  .mnode.ext { color: var(--green); }
  .mnode.ext.now { border-color: var(--green); box-shadow: 0 0 10px rgba(109,255,166,0.7); }

  /* ---------- bounty bar ---------- */
  #bounty { margin-top: 10px; font-size: 12px; letter-spacing: 1px; display: none; align-items: center; gap: 8px; }
  #bounty.show { display: flex; }
  #bounty .star { color: var(--amber); }
  #bounty.claimed { opacity: 0.6; }
  #bounty .bname { color: #fff; }
  #bounty .brew { color: var(--green); }

  /* ---------- loot pops ---------- */
  #lootlayer { position: absolute; left: 0; right: var(--cam-clear); bottom: 230px; height: 200px; pointer-events: none; }
  .lootpop {
    position: absolute; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
    animation: lootrise 2.6s ease-out forwards;
  }
  .lootpop .ltext { font-size: 12px; letter-spacing: 1px; color: #fff; white-space: nowrap; text-shadow: 0 0 6px #000; }
  .lootpop .lval { font-size: 11px; }
  .lootpop.bounty .ltext { color: var(--amber); }
  @keyframes lootrise {
    0% { opacity: 0; transform: translateY(20px) scale(0.7); }
    12% { opacity: 1; transform: translateY(0) scale(1.1); }
    22% { transform: translateY(-6px) scale(1); }
    78% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-90px) scale(0.9); }
  }

  /* ---------- season wipe countdown ---------- */
  #wipebar {
    position: absolute; left: 50%; top: 12%; transform: translateX(-50%);
    text-align: center; display: none; padding: 22px 48px; border: 2px solid var(--red);
    background: rgba(30, 6, 8, 0.92); border-radius: 6px; box-shadow: 0 0 60px rgba(255, 79, 79, 0.45);
    animation: wpulse 1s ease-in-out infinite;
  }
  #wipebar.show { display: block; }
  #wipebar .wlabel { color: var(--red); font-size: 16px; letter-spacing: 6px; font-weight: bold; }
  #wipebar .wsub { color: #fff; font-size: 14px; letter-spacing: 2px; margin: 8px 0; opacity: 0.85; }
  #wipebar .wclock { color: #fff; font-size: 72px; font-weight: bold; letter-spacing: 6px; line-height: 1.1; text-shadow: 0 0 24px rgba(255, 79, 79, 0.8); }
  @keyframes wpulse { 50% { box-shadow: 0 0 90px rgba(255, 79, 79, 0.8); border-color: #fff; } }

  /* ---------- center-screen event stingers ---------- */
  #announce {
    position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; opacity: 0; max-width: 1100px;
  }
  #announce .big {
    font-size: 58px; font-weight: bold; letter-spacing: 10px; color: #fff;
    text-shadow: 0 0 18px rgba(255, 180, 84, 0.7), 0 0 60px rgba(255, 180, 84, 0.35);
  }
  #announce .sub { font-size: 17px; letter-spacing: 4px; opacity: 0.75; margin-top: 10px; }
  #announce.danger .big { color: var(--red); text-shadow: 0 0 18px rgba(255, 79, 79, 0.8), 0 0 70px rgba(255, 79, 79, 0.4); }
  #announce.good .big { color: var(--green); text-shadow: 0 0 18px rgba(109, 255, 166, 0.8), 0 0 70px rgba(109, 255, 166, 0.4); }
  #announce.show { animation: stinger 2.6s ease-out forwards; }
  @keyframes stinger {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(1.06); }
    6% { opacity: 1; }
    9% { opacity: 0.15; }   /* CRT flicker on the way in */
    13% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    72% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.98); }
  }

  /* ---------- action callout (non-vote rooms) ---------- */
  #action {
    position: absolute; left: 36px; bottom: 250px;
    width: var(--vote-width); padding: 12px 16px; display: none;
  }
  #action.show { display: flex; align-items: center; gap: 14px; }
  #action .aword { font-size: 26px; font-weight: bold; letter-spacing: 4px; color: var(--green); white-space: nowrap; animation: blink 1.6s steps(2) infinite; }
  #action.brace .aword { color: var(--blue); }
  #action .ainfo { flex: 1; min-width: 0; }
  #action .aprompt { font-size: 13px; color: #fff; letter-spacing: 0.5px; }
  #action .ameta { font-size: 11px; opacity: 0.65; margin-top: 4px; letter-spacing: 1px; }
  #action .acount { font-size: 22px; color: #fff; white-space: nowrap; }

  /* ---------- vote panel ---------- */
  #vote {
    /* Anchored bottom-left above the status panel, sized by --vote-width. */
    position: absolute; left: 36px; bottom: 250px;
    width: var(--vote-width); padding: 16px 18px; display: none; text-align: center;
  }
  #vote.show { display: block; }
  #vote .prompt { font-size: 17px; color: #fff; letter-spacing: 1px; margin-bottom: 12px; }
  #vote .opts { display: flex; gap: 14px; }
  .opt { flex: 1; }
  .opt .word { font-size: 24px; font-weight: bold; letter-spacing: 3px; }
  .opt.a .word { color: var(--amber); } .opt.b .word { color: var(--blue); }
  .opt .label { font-size: 12px; opacity: 0.75; margin: 3px 0 6px; }
  .opt .bar { height: 12px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  .opt.a .bar i { background: var(--amber); } .opt.b .bar i { background: var(--blue); }
  .opt .bar i { display: block; height: 100%; width: 0%; transition: width 0.6s ease; }
  .opt .count { font-size: 15px; margin-top: 4px; color: #fff; }
  #vote .vtimer { margin-top: 10px; font-size: 13px; letter-spacing: 3px; }
  #vote .hint { font-size: 11px; opacity: 0.6; margin-top: 5px; letter-spacing: 1px; }
</style>
</head>
<body>
  <div id="pulse"></div>

  <div id="wipebar">
    <div class="wlabel">⚠ THE BENEFACTOR HAS BEEN PAID ⚠</div>
    <div class="wsub" id="wsub"></div>
    <div class="wclock" id="wclock">0:00</div>
    <div class="wlabel">SEASON WIPE — ALL PROGRESS RESETS</div>
  </div>

  <div id="announce"><div class="big"></div><div class="sub"></div></div>

  <div id="idle" class="panel">
    NIGHT SHIFT // NEXT SHIFT <b id="countdown">--:--</b>
    &nbsp;·&nbsp; <span class="blink">!clockin</span> to enroll · !deploy when doors open
  </div>

  <div id="action" class="panel">
    <div class="aword" id="aword"></div>
    <div class="ainfo">
      <div class="aprompt" id="aprompt"></div>
      <div class="ameta" id="ameta"></div>
    </div>
    <div class="acount" id="acount"></div>
  </div>

  <div id="vote" class="panel">
    <div class="prompt" id="vprompt"></div>
    <div class="opts">
      <div class="opt a"><div class="word" id="vaword"></div><div class="label" id="valabel"></div><div class="bar"><i id="vabar"></i></div><div class="count" id="vacount">0</div></div>
      <div class="opt b"><div class="word" id="vbword"></div><div class="label" id="vblabel"></div><div class="bar"><i id="vbbar"></i></div><div class="count" id="vbcount">0</div></div>
    </div>
    <div class="vtimer" id="vtimer"></div>
    <div class="hint">TYPE THE WORD IN CHAT — EVERYONE VOTES, NOT JUST RAIDERS</div>
  </div>

  <div id="hud">
    <div id="status" class="panel">
      <div class="shift" id="shiftno">SHIFT #—</div>
      <div class="room" id="roomname"></div>
      <div class="timer" id="timer">--</div>
      <div class="bar"><i id="roombar"></i></div>
      <div id="minimap"></div>
      <div id="bounty"><span class="star">★</span><span>BOUNTY</span> <span class="bname" id="bname"></span> <span class="brew" id="brew"></span></div>
    </div>
    <div id="feed" class="panel"></div>
    <div id="squad" class="panel">
      <h3 id="squadhead">ON SHIFT</h3>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div id="lootlayer"></div>

  <script src="/sprites.js"></script>
  <script src="/overlay.js"></script>
</body>
</html>
